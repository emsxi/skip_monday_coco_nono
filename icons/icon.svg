<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#01579B"/>
      <stop offset="50%" style="stop-color:#0288D1"/>
      <stop offset="100%" style="stop-color:#4FC3F7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>
  <rect width="512" height="512" rx="100" ry="100" fill="url(#shine)"/>
  <!-- Stars -->
  <circle cx="80" cy="80" r="3" fill="white" opacity="0.6"/>
  <circle cx="420" cy="60" r="2" fill="white" opacity="0.5"/>
  <circle cx="450" cy="140" r="2.5" fill="white" opacity="0.4"/>
  <circle cx="60" cy="200" r="2" fill="white" opacity="0.5"/>
  <circle cx="130" cy="50" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="380" cy="420" r="2" fill="white" opacity="0.3"/>
  <circle cx="100" cy="400" r="2.5" fill="white" opacity="0.4"/>
  <!-- Calendar page (Monday) being skipped -->
  <g transform="translate(256, 200) rotate(-12)">
    <rect x="-65" y="-80" width="130" height="155" rx="12" fill="white" opacity="0.95"/>
    <rect x="-65" y="-80" width="130" height="38" rx="12" fill="#e53935"/>
    <rect x="-65" y="-55" width="130" height="13" fill="#e53935"/>
    <text x="0" y="-56" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white">MON</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="72" font-weight="900" fill="#1a237e">一</text>
    <text x="0" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#e53935">周一</text>
  </g>
  <!-- Big X / Skip mark -->
  <g transform="translate(256, 195)" stroke="#FF5252" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <line x1="-85" y1="-90" x2="85" y2="90"/>
    <line x1="85" y1="-90" x2="-85" y2="90"/>
  </g>
  <!-- Skip arrow -->
  <g transform="translate(256, 380)">
    <text x="0" y="0" text-anchor="middle" font-size="48">⏭️</text>
  </g>
  <!-- 锅仔 emoji -->
  <g transform="translate(420, 350)">
    <text x="0" y="0" text-anchor="middle" font-size="56">🍳</text>
  </g>
  <!-- 可可 emoji -->
  <g transform="translate(90, 320)">
    <text x="0" y="0" text-anchor="middle" font-size="48">🐱</text>
  </g>
</svg>
